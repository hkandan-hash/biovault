[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biovault"
version = "0.1.0"
description = "A bioinformatics research data platform that works with any data."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["bioinformatics", "data-platform", "fasta", "fastq", "vcf", "research-data"]

[project.scripts]
biovault = "biovault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
